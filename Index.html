    header::before { content:""; position:absolute; z-index:-1; inset:-35% -30%; background:radial-gradient(ellipse at 20% 35%,#ffe99e 0%,transparent 38%),radial-gradient(ellipse at 80% 65%,#ff009b 0%,transparent 42%),linear-gradient(110deg,#6441a6,#8178ff 55%,#8c7af4); background-size:160% 160%,160% 160%,100% 100%; animation:header-gradient-flow 4s ease-in-out infinite alternate; }
    @keyframes header-gradient-flow { from { background-position:0% 20%,100% 80%,center; } to { background-position:100% 65%,0% 30%,center; } }
    @media (prefers-reduced-motion:reduce) { header::before { animation:none; } }
    .brand { font-size:40px; font-weight:700; line-height:1; }
    .brand .eyebrow { margin-top:5px; font-size:10px; font-weight:600; line-height:1.3; }
    main { width:min(100%,390px); margin:0 auto; padding:24px 24px 40px; }
    .hero { margin:0 0 24px; }
    .pixel-label { display:none; }
    h1 { margin:0; color:#fff; font-size:32px; line-height:1.25; font-weight:700; }
    body[data-view="search"] .hero { text-align:center; padding-top:8px; margin-bottom:28px; }
    body[data-view="search"] h1 { font-size:36px; line-height:1.15; }
    .card { border-radius:20px; }
    #search-card { background:var(--surface); border:1px solid #eee773; padding:24px; }
    label { display:block; margin:0 0 18px; font-weight:600; font-size:17px; }
    .search-row { display:flex; flex-direction:column; gap:14px; }
    input { width:100%; min-width:0; min-height:56px; padding:12px 16px; border:1px solid #65497d; border-radius:12px; background:#fff; color:#21152f; font-size:17px; }
    input::placeholder { color:#655771; }
    .primary { width:100%; min-height:56px; border:1px solid #65497d; border-radius:12px; background:var(--yellow); color:#21152f; font-weight:700; }
    .primary:hover { background:#fffdd0; }
    .primary:disabled { cursor:wait; opacity:.7; }
    #search-help { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    .contact { margin:0; color:#f2eafa; font-size:12px; font-weight:700; line-height:1.6; }
    .last-updated { margin:0; color:#fff; font-size:12px; font-weight:700; line-height:1.5; }
    .notice-dialog { width:min(90vw, 400px); padding:24px; border:1px solid #cfbedf; border-radius:20px; background:#48325f; color:#fff; text-align:center; box-shadow:0 16px 40px #170d2f80; }
    .notice-dialog::backdrop { background:rgba(18,10,30,.75); }
    .notice-dialog h2 { font-size:22px; }
    .notice-dialog p { line-height:1.5; color:#f4eafb; }
    #message { margin:16px 0; color:#fff; font-size:14px; }
    #message:empty { display:none; }
    #matches { margin:0 0 24px; }
    .match { display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; margin:10px 0; padding:16px; text-align:left; border:1px solid var(--line); border-radius:12px; background:var(--result); color:#fff; }
    .match span:first-child { overflow-wrap:anywhere; }
    .match span:last-child { color:#f1d9ff; white-space:nowrap; font-size:13px; }
    .match:hover { border-color:var(--yellow); }
    #result { margin-top:24px; padding:24px; background:linear-gradient(145deg,rgba(83,57,114,.78),rgba(39,24,61,.84)); color:#fff; border:1px solid rgba(244,231,255,.38); border-radius:22px; box-shadow:0 12px 30px rgba(19,10,35,.25),inset 0 1px 0 rgba(255,255,255,.12); -webkit-backdrop-filter:blur(18px) saturate(125%); backdrop-filter:blur(18px) saturate(125%); }
    .member-head { display:flex; flex-direction:column; align-items:flex-start; gap:16px; }
    h2 { margin:0; font-size:30px; line-height:1.25; overflow-wrap:anywhere; }
    #nickname { margin:5px 0 0; color:var(--muted); }
    .status { display:inline-flex; min-width:140px; min-height:48px; padding:10px 16px; align-items:center; justify-content:center; border:1px solid rgba(255,255,255,.5); border-radius:12px; background:var(--yellow); color:#21152f; font-weight:700; }
    .status.unknown { background:#e9dcf9; color:#352049; }
    .stats { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin:20px 0; }
    .stat { min-width:0; display:flex; flex-direction:row-reverse; justify-content:space-between; align-items:center; gap:8px; padding:14px 12px; border:1px solid rgba(255,181,189,.55); border-radius:14px; background:rgba(53,29,43,.82); color:#ffb5bd; transition:background-color .2s ease,border-color .2s ease; }
    .stat:nth-child(2) { background:rgba(21,44,64,.86); border-color:rgba(158,220,255,.5); color:#9edcff; }
    .stat.workshop-stat { background:rgba(67,48,25,.85); border-color:rgba(255,251,180,.55); color:#fffbb4; }
    .stat.choreo-stat { background:rgba(65,39,80,.85); border-color:rgba(223,162,255,.55); color:#efc9ff; }
    .stat[hidden] { display:none; }
    @media (hover:hover) { .stat:hover { border-color:rgba(255,255,255,.8); } }
    .stat strong { font-size:30px; line-height:1.2; }
    .stat span { font-size:14px; }
    h3 { display:flex; align-items:center; gap:8px; margin:20px 0 12px; font-size:17px; }
    #total-count { padding:2px 7px; border-radius:7px; background:#30203f; color:#dfa2ff; font-size:13px; font-weight:500; }
    .table-wrap { overflow-x:auto; background:rgba(25,16,40,.86); border:1px solid rgba(207,190,223,.28); border-radius:16px; padding:0 14px; }
    table { width:100%; border-collapse:collapse; text-align:left; font-size:14px; }
    th { padding:12px 0; color:var(--muted); font-size:12px; font-weight:500; }
    th:last-child,td:last-child { text-align:right; }
    td { padding:10px 0; overflow-wrap:anywhere; }
    td:last-child { padding-left:10px; }
    .role { display:inline-block; padding:4px 10px; border:1px solid #ffb5bd; border-radius:12px; color:#21152f; background:#f6f2fc; font-size:12px; white-space:nowrap; }
    .role.staff { background:#f6f2fc; color:#21152f; }
    #empty-activities,.note { color:var(--muted); font-size:12px; }
    .result-foot { display:flex; flex-direction:column; align-items:flex-start; gap:10px; margin-top:18px; }
    .result-foot .note { margin:0; }
    .secondary { border:1px solid rgba(224,209,237,.6); border-radius:10px; background:rgba(50,32,71,.65); color:#fff; padding:9px 14px; transition:background-color .2s ease,border-color .2s ease; }
    .secondary:hover { background:rgba(105,72,158,.8); border-color:#fffbb4; }
    body { display:flex; flex-direction:column; }
    footer { margin-top:auto; padding:18px 24px; background:#503478; border-top:1px solid rgba(224,209,237,.12); color:#e0d1ed; font-size:12px; }
    .footer-inner { width:min(100%,660px); margin:0 auto; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 20px; }
    .examples { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:16px; font-size:13px; }
    .example { padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:#48325f; color:white; }
    @media (min-width:700px) { header { padding-inline:max(24px,calc((100vw - 660px)/2)); } main { width:min(100%,708px); } body[data-view="search"] h1 { font-size:44px; } #result { padding:30px; } }
    @media (max-width:360px) { main { padding-inline:16px; } #search-card, #result { padding:20px; } h2 { font-size:27px; } }
    @media (prefers-reduced-motion:reduce) { .stat,.secondary { transition:none; } }
  </style>
</head>
<body data-view="search">
  <header><div class="brand">CU<span>DC</span><div class="eyebrow">Chulalongkorn University Dance Club</div></div></header>
  <main>
    <section class="hero" aria-labelledby="title">
      <div><h1 id="title">CHECK UR STATUS</h1></div>
    </section>
    <section class="card" id="search-card" aria-label="Find a member">
      <form id="search-form">
        <label for="query">Student ID or phone number</label>
        <div class="search-row"><input id="query" name="query" placeholder="Student ID or phone number" autocomplete="off" maxlength="30" inputmode="tel" aria-describedby="search-help" required><button class="primary" id="search-button" type="submit">Search →</button></div>
        <p class="note" id="search-help">Use your full student ID or phone number.</p>
      </form>
    </section>
    <p id="message" role="status" aria-live="polite"></p>
    <section id="matches" aria-label="Select a member" hidden></section>
    <section class="card" id="result" aria-labelledby="member-name" hidden>
      <div class="member-head"><div><h2 id="member-name" tabindex="-1"></h2><p id="nickname" class="muted"></p></div><span id="member-status" class="status"></span></div>
      <div id="activity-details"><div class="stats"><div class="stat" id="dancer-stat"><strong id="dancer-count"></strong><span>Dancer</span></div><div class="stat" id="staff-stat"><strong id="staff-count"></strong><span>Staff</span></div><div class="stat workshop-stat" id="workshop-stat"><strong id="workshop-count"></strong><span>Workshop</span></div><div class="stat choreo-stat" id="choreo-stat" hidden><strong id="choreo-count"></strong><span>Choreo</span></div></div>
      <h3>Activities <span id="total-count" aria-label="Recorded activity count"></span></h3>
      <div class="table-wrap"><table><thead><tr><th scope="col">Activity</th><th scope="col">Role</th></tr></thead><tbody id="activities"></tbody></table></div>
      <p id="empty-activities" class="muted" hidden>No activities recorded.</p>
      </div><div class="result-foot"><button class="secondary" id="reset" type="button">Search again</button><p class="note" id="record-note"></p><p class="last-updated" id="last-updated" aria-live="polite">Last updated: —</p></div>
    </section>
  </main>
  <footer><div class="footer-inner"><p class="contact">Need help? Contact Taming (ต้าหมิง)  line: taming0931</p><span>CUDC 2026</span></div></footer>
  <dialog id="not-found-dialog" class="notice-dialog" aria-labelledby="notice-title" aria-describedby="notice-text"><h2 id="notice-title">Member not found</h2><p id="notice-text"></p><button type="button" class="primary" id="close-notice">OK</button></dialog>
  <dialog id="found-dialog" class="notice-dialog" aria-labelledby="found-title"><h2 id="found-title">Member found</h2><button type="button" class="primary" id="close-found" style="margin-top:20px">OK</button></dialog>
  <script>
const $ = id => document.getElementById(id);
function refreshLastUpdated() {
  if (!window.google || !google.script || !google.script.run) return;
  google.script.run.withSuccessHandler(response => {
    $('last-updated').textContent = 'Last updated: ' + (response && response.ok && response.value ? response.value : 'Unavailable');
  }).withFailureHandler(() => { $('last-updated').textContent = 'Last updated: Unavailable'; }).getLastUpdated();
}
refreshLastUpdated();
const normalize = value => {
  const text = String(value).replace(/[๐-๙]/g, digit => String(digit.charCodeAt(0) - 0x0E50));
  if (!/^\+?[\d\s()\-\u200B-\u200D\uFEFF]+$/.test(text.trim())) return '';
  return text.replace(/[\s()\-\u200B-\u200D\uFEFF+]/g, '');
};
const validIdentifier = value => /^\d{10}$/.test(normalize(value)) || /^66\d{9}$/.test(normalize(value));
const isStudentId = value => /^6\d{9}$/.test(normalize(value));
$('close-notice').addEventListener('click', () => $('not-found-dialog').close());
$('close-found').addEventListener('click', () => $('found-dialog').close());
let requestVersion = 0;
const errors = {
  INVALID_QUERY: 'Enter a 10-digit student ID or phone number. Thai phone numbers may also use +66.',
  INVALID_SELECTION: 'Please search again and select your name.',
  STALE_SELECTION: 'The member list changed. Please search again.',
  SHEET_STRUCTURE: 'Member information is temporarily unavailable. Please contact the registration team.',
  CHOREO_LOOKUP: 'Unable to verify your Choreo status. Please contact the registration team.',
  SERVICE_UNAVAILABLE: 'Unable to load. Please try again in a moment.',
  LOCAL_PREVIEW: 'Open the deployed Apps Script web app to search live member information.',
  TIMEOUT: 'The search is taking too long. Please try again in a moment.'
};

function callBackend(method, ...args) {
  return new Promise((resolve, reject) => {
    if (!window.google || !window.google.script || !window.google.script.run) {
      reject(new Error('LOCAL_PREVIEW')); return;
    }
    // A timeout stops waiting in the UI; it does not cancel a server execution.
    const timer = setTimeout(() => reject(new Error('TIMEOUT')), 45000);
    const runner = window.google.script.run
      .withSuccessHandler(response => {
        clearTimeout(timer);
        if (!response || response.ok !== true) reject(new Error(response && response.code || 'SERVICE_UNAVAILABLE'));
        else resolve(response.result);
      })
      .withFailureHandler(() => { clearTimeout(timer); reject(new Error('SERVICE_UNAVAILABLE')); });
    if (method === 'searchMembers') runner.searchMembers(...args);
    else if (method === 'getMember') runner.getMember(...args);
    else { clearTimeout(timer); reject(new Error('SERVICE_UNAVAILABLE')); }
  });
}

function setLoading(busy) {
  $('search-button').disabled = busy;
  $('search-button').textContent = busy ? 'Searching…' : 'Search →';
  $('search-card').setAttribute('aria-busy', String(busy));
  document.querySelectorAll('[data-query], .match').forEach(button => { button.disabled = busy; });
}

function showMember(member) {
  $('matches').hidden = true;
  document.body.dataset.view = 'result'; $('title').textContent = 'Your CUDC status';
  $('member-name').textContent = member.name;
  $('nickname').textContent = member.nickname || '';
  $('nickname').hidden = !member.nickname;
  const label = member.status || 'Not recorded';
  const style = label === 'Not recorded' ? 'unknown' : '';
  $('activity-details').hidden = false;
  $('record-note').hidden = false;
  $('member-status').textContent = label;
  $('member-status').className = 'status ' + style;
  $('dancer-stat').hidden = !!member.isChoreo;
  $('staff-stat').hidden = !!member.isChoreo;
  $('workshop-stat').hidden = !!member.isChoreo;
  $('choreo-stat').hidden = !member.isChoreo;
  $('workshop-count').textContent = member.workshop == null ? '—' : member.workshop;
  $('choreo-count').textContent = member.choreo == null ? '—' : member.choreo;
  $('dancer-count').textContent = member.dancer == null ? '—' : member.dancer;
  $('staff-count').textContent = member.staff == null ? '—' : member.staff;
  $('total-count').textContent = member.activities.length;
  $('activities').replaceChildren();
  for (const activity of member.activities) {
    const row = document.createElement('tr');
    const nameCell = document.createElement('td');
    const roleCell = document.createElement('td');
    const badge = document.createElement('span');
    nameCell.textContent = activity.name;
    badge.textContent = activity.role;
    badge.className = 'role' + (activity.role === 'Staff' ? ' staff' : '');
    roleCell.append(badge); row.append(nameCell, roleCell); $('activities').append(row);
  }
  $('empty-activities').hidden = member.activities.length > 0;
  $('record-note').textContent = 'Recorded activities only; blank entries are unknown.' +
    (member.hasUnrecognizedRole ? ' Contact registration to check other roles.' : '');
  $('result').hidden = false;
  $('message').textContent = '';
  $('member-name').focus();
  $('found-dialog').showModal();
}

async function selectMember(query, selection) {
  const version = ++requestVersion;
  setLoading(true);
  $('message').textContent = 'Loading member information…';
  try {
    const response = await callBackend('getMember', query, selection);
    if (version === requestVersion) showMember(response.member);
  } catch (error) {
    if (version === requestVersion) {
      $('matches').hidden = true;
      $('message').textContent = errors[error.message] || errors.SERVICE_UNAVAILABLE;
    }
  } finally { if (version === requestVersion) setLoading(false); }
}

$('search-form').addEventListener('submit', async event => {
  event.preventDefault();
  if ($('search-button').disabled) return;
  const query = $('query').value.trim();
  const version = ++requestVersion;
  $('result').hidden = true; $('matches').hidden = true; $('matches').replaceChildren();
  if (!validIdentifier(query) || query.length > 30) {
    $('message').textContent = errors.INVALID_QUERY; $('query').focus(); return;
  }
  setLoading(true);
  refreshLastUpdated();
  $('message').textContent = 'Searching…';
  try {
    const response = await callBackend('searchMembers', query);
    if (version !== requestVersion) return;
    if (response.kind === 'empty') {
      $('message').textContent = '';
      $('notice-text').textContent = isStudentId(query) ? 'Student ID not found. Please try your phone number.' : 'Phone number not found. Please check the number and try again.';
      $('not-found-dialog').showModal();
    }
    else if (response.kind === 'single') showMember(response.member);
    else if (response.kind === 'matches') {
      document.body.dataset.view = 'matches'; $('title').textContent = 'Your CUDC status';
      $('message').textContent = response.matches.length + ' matches · Select your name';
      for (const [index, member] of response.matches.entries()) {
        const button = document.createElement('button'); button.type = 'button'; button.className = 'match';
        const name = document.createElement('span'); name.textContent = member.name + (member.nickname ? ' (' + member.nickname + ')' : '');
        const arrow = document.createElement('span'); arrow.textContent = 'Select →';
        // Exact same names cannot be reliably distinguished; ask the registration team.
        const identical = response.matches.filter(other => other.name === member.name && other.nickname === member.nickname).length > 1;
        if (identical) {
          arrow.textContent = 'Contact registration';
          button.addEventListener('click', () => { $('message').textContent = 'These members have identical names and nicknames. Please contact the registration team.'; });
        } else button.addEventListener('click', () => selectMember(query, member));
        button.append(name, arrow); $('matches').append(button);
      }
      $('matches').hidden = false;
    } else throw new Error('SERVICE_UNAVAILABLE');
  } catch (error) {
    if (version === requestVersion) $('message').textContent = errors[error.message] || errors.SERVICE_UNAVAILABLE;
  } finally { if (version === requestVersion) setLoading(false); }
});
document.querySelectorAll('[data-query]').forEach(button => button.addEventListener('click', () => {
  if ($('search-button').disabled) return;
  $('query').value = button.dataset.query; $('search-form').requestSubmit();
}));
$('reset').addEventListener('click', () => {
  ++requestVersion; setLoading(false);
  $('result').hidden = true; $('matches').hidden = true; $('matches').replaceChildren();
  document.body.dataset.view = 'search'; $('title').textContent = 'CHECK UR STATUS';
  $('query').value = ''; $('message').textContent = 'Enter your student ID or phone number.'; $('query').focus();
});

  </script>
</body>
</html>
